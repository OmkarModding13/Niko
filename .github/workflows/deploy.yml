name: Deploy Niko to PC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: niko-pc-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Check PC Git state
        shell: cmd
        run: |
          cd /d D:\Niko
          git config --global --add safe.directory D:\Niko
          if not exist D:\Niko\.git exit /b 1
          git status --short
          git rev-parse HEAD

      - name: Fetch GitHub main
        shell: cmd
        run: |
          cd /d D:\Niko
          git fetch origin main --verbose

      - name: Update PC code
        shell: cmd
        run: |
          cd /d D:\Niko
          git reset --hard origin/main

      - name: Initialize PM2
        shell: cmd
        run: |
          set PM2_HOME=C:\ProgramData\pm2\home
          echo PM2_HOME=%PM2_HOME%
          where pm2
          call pm2 resurrect
          call pm2 status

      - name: Restart Niko
        shell: cmd
        run: |
          set PM2_HOME=C:\ProgramData\pm2\home
          call pm2 restart niko --update-env
          call pm2 status

      - name: Verify Niko is ready
        shell: cmd
        run: |
          for /L %%I in (1,1,30) do (
            curl.exe -fsS http://127.0.0.1:3000/ready >nul 2>&1
            if not errorlevel 1 (
              echo Niko readiness check passed.
              exit /b 0
            )
            timeout /t 2 /nobreak >nul
          )
          echo Niko did not become ready on port 3000.
          exit /b 1

      - name: Ensure daily database backup task
        shell: cmd
        run: |
          if not exist D:\Niko\scripts\backup-db.ps1 exit /b 0
          schtasks /Create /TN "Niko Database Backup" /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\Niko\scripts\backup-db.ps1" /SC DAILY /ST 03:00 /RU SYSTEM /F
