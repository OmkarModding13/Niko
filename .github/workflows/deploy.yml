name: Deploy Niko to PC

on:
  push:
    branches:
      - main

concurrency:
  group: niko-pc-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Prepare safe staging deployment
        shell: cmd
        run: |
          cd /d D:\Niko
          set PM2_HOME=C:\ProgramData\pm2\home
          git config --global --add safe.directory D:\Niko
          git fetch origin main
          if errorlevel 1 exit /b 1

          if exist D:\Niko-staging rmdir /s /q D:\Niko-staging
          mkdir D:\Niko-staging

          git archive origin/main -o D:\Niko-staging.zip
          if errorlevel 1 exit /b 1

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath 'D:\Niko-staging.zip' -DestinationPath 'D:\Niko-staging' -Force"
          if errorlevel 1 exit /b 1

          del /q D:\Niko-staging.zip

          copy /y D:\Niko\.env D:\Niko-staging\.env >nul
          if errorlevel 1 exit /b 1

          cd /d D:\Niko-staging
          call npm ci
          if errorlevel 1 exit /b 1

          call npm run migrate:check
          if errorlevel 1 exit /b 1

      - name: Switch to staged version
        shell: cmd
        run: |
          set PM2_HOME=C:\ProgramData\pm2\home

          if exist D:\Niko-previous rmdir /s /q D:\Niko-previous

          call pm2 stop niko
          if errorlevel 1 exit /b 1

          ren D:\Niko Niko-previous
          if errorlevel 1 exit /b 1

          ren D:\Niko-staging Niko
          if errorlevel 1 (
            ren D:\Niko-previous Niko
            call pm2 restart niko --update-env
            exit /b 1
          )

          call pm2 restart niko --update-env
          if errorlevel 1 exit /b 1

      - name: Verify Niko is ready
        shell: cmd
        run: |
          setlocal
          for /L %%I in (1,1,30) do (
            curl.exe -fsS http://127.0.0.1:3000/ready >nul 2>&1
            if not errorlevel 1 (
              echo Niko readiness check passed.
              exit /b 0
            )
            timeout /t 2 /nobreak >nul
          )
          echo Niko did not become ready on port 3000.
          exit /b 1

      - name: Ensure daily database backup task
        shell: cmd
        run: |
          schtasks /Create /TN "Niko Database Backup" /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\Niko\scripts\backup-db.ps1" /SC DAILY /ST 03:00 /RU SYSTEM /F
          if errorlevel 1 exit /b 1
          echo Daily Niko database backup task is configured.

      - name: Roll back failed switch
        if: ${{ failure() }}
        shell: cmd
        run: |
          set PM2_HOME=C:\ProgramData\pm2\home

          if exist D:\Niko-previous (
            call pm2 stop niko >nul 2>&1
            if exist D:\Niko-failed rmdir /s /q D:\Niko-failed
            if exist D:\Niko ren D:\Niko Niko-failed
            ren D:\Niko-previous Niko
            call pm2 restart niko --update-env
          )

          if exist D:\Niko-staging rmdir /s /q D:\Niko-staging
          if exist D:\Niko-failed rmdir /s /q D:\Niko-failed
