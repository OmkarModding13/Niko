name: Deploy Niko to PC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: niko-pc-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true
          path: niko-checkout

      - name: Deploy code to D drive
        shell: cmd
        run: |
          set PM2_HOME=C:\ProgramData\pm2\home
          set CHECKOUT=%GITHUB_WORKSPACE%\niko-checkout

          if not exist "%CHECKOUT%\package.json" (
            echo ERROR: GitHub checkout is missing package.json.
            exit /b 1
          )

          if exist D:\Niko\package-lock.json (
            fc /b D:\Niko\package-lock.json "%CHECKOUT%\package-lock.json" >nul 2>&1
            set LOCK_CHANGED=%ERRORLEVEL%
          ) else (
            set LOCK_CHANGED=1
          )

          echo Copying latest code to D:\Niko...
          robocopy "%CHECKOUT%" "D:\Niko" /E /XD node_modules .git /XF .env /NFL /NDL /NJH /NJS /NC /NS /NP
          set ROBOCOPY_EXIT=%ERRORLEVEL%
          if %ROBOCOPY_EXIT% GEQ 8 exit /b %ROBOCOPY_EXIT%

          if "%LOCK_CHANGED%"=="0" goto DEPENDENCIES_READY

          echo package-lock.json changed. Installing dependencies...
          call pm2 resurrect >nul 2>&1
          call pm2 stop niko >nul 2>&1

          cd /d D:\Niko
          call npm ci --prefer-offline --no-audit --no-fund
          if errorlevel 1 exit /b 1

          :DEPENDENCIES_READY
          echo Code deployment complete.
          exit /b 0

      - name: Validate personalized welcome banner generation
        shell: cmd
        run: |
          cd /d D:\\Niko
          call node scripts\\test-welcome-banner.js
          if errorlevel 1 exit /b 1

      - name: Initialize PM2
        shell: cmd
        run: |
          set PM2_HOME=C:\ProgramData\pm2\home
          call pm2 resurrect
          if errorlevel 1 exit /b 1
          call pm2 status

      - name: Restart Niko
        shell: cmd
        run: |
          set PM2_HOME=C:\ProgramData\pm2\home
          call pm2 restart niko --update-env
          if errorlevel 1 exit /b 1
          call pm2 status

      - name: Verify Niko is ready
        shell: cmd
        run: |
          for /L %%I in (1,1,45) do (
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "try { $r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3000/ready' -TimeoutSec 2; if ($r.StatusCode -eq 200) { exit 0 } else { exit 1 } } catch { exit 1 }"
            if not errorlevel 1 (
              echo Niko readiness check passed.
              exit /b 0
            )
            timeout /t 2 /nobreak >nul
          )
          echo Niko did not become ready within 90 seconds.
          exit /b 1

      - name: Ensure daily database backup task
        shell: cmd
        run: |
          if not exist D:\Niko\scripts\backup-db.ps1 exit /b 0
          schtasks /Create /TN "Niko Database Backup" /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\Niko\scripts\backup-db.ps1" /SC DAILY /ST 03:00 /RU SYSTEM /F
