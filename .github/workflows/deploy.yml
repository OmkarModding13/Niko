name: Deploy Niko to PC

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: niko-pc-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Deploy latest main
        shell: cmd
        run: |
          cd /d D:\Niko
          set PM2_HOME=C:\ProgramData\pm2\home
          git config --global --add safe.directory D:\Niko

          if not exist D:\Niko\.git (
            echo ERROR: D:\Niko is not a Git repository.
            exit /b 1
          )

          for /f "delims=" %%A in ('git rev-parse HEAD') do set PREVIOUS_SHA=%%A

          git fetch origin main
          if errorlevel 1 exit /b 1

          git diff --quiet %PREVIOUS_SHA% origin/main -- package-lock.json
          if not errorlevel 1 goto DEPENDENCIES_READY

          echo package-lock.json changed. Updating dependencies...
          git reset --hard origin/main
          if errorlevel 1 exit /b 1

          call pm2 stop niko
          if errorlevel 1 exit /b 1

          call npm ci --prefer-offline --no-audit --no-fund
          if errorlevel 1 (
            echo Dependency installation failed. Rolling back code...
            git reset --hard %PREVIOUS_SHA%
            call pm2 restart niko --update-env
            exit /b 1
          )
          goto RESTART_NIKO

          :DEPENDENCIES_READY
          git reset --hard origin/main
          if errorlevel 1 exit /b 1

          :RESTART_NIKO
          call pm2 restart niko --update-env
          if errorlevel 1 exit /b 1

      - name: Verify Niko is ready
        shell: cmd
        run: |
          for /L %%I in (1,1,30) do (
            curl.exe -fsS http://127.0.0.1:3000/ready >nul 2>&1
            if not errorlevel 1 (
              echo Niko readiness check passed.
              exit /b 0
            )
            timeout /t 2 /nobreak >nul
          )
          echo Niko did not become ready on port 3000.
          exit /b 1

      - name: Ensure daily database backup task
        shell: cmd
        run: |
          if not exist D:\Niko\scripts\backup-db.ps1 (
            echo Backup script not found; skipping scheduled task setup.
            exit /b 0
          )

          schtasks /Create /TN "Niko Database Backup" /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\Niko\scripts\backup-db.ps1" /SC DAILY /ST 03:00 /RU SYSTEM /F
          if errorlevel 1 exit /b 1
          echo Daily Niko database backup task is configured.
