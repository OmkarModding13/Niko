name: Deploy Niko to PC

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy latest main to D:\\Niko
        shell: cmd
        run: |
          cd /d D:\\Niko
          git fetch origin main
          git reset --hard origin/main
          call npm ci
          set PM2_HOME=C:\\ProgramData\\pm2\\home
          call pm2 restart niko --update-env
